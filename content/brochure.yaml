# Contenuti della brochure pieghevole MonPiz.
# Tutti i percorsi delle immagini sono relativi alla cartella `assets/`.
# I testi accettano "\n" (o i blocchi YAML `|`) per forzare un a capo.

meta:
  title: MonPiz — Brochure di presentazione
  author: MonPiz
  subject: Pedule urban fashion, made in Italy

# FORMATO ###################################################################################################
# Formato CHIUSO in mm. Aperto: larghezza × 2. Due ante, una piega al centro.
format:
  width_mm: 150
  height_mm: 150
  bleed_mm: 3
  type_scale: 1.2        # grandezza dei testi: 1 = come nel 17x12, 1.2 = +20% (consigliato per il 15x15)

identity:
  logo: images/logo.png

# ESTERNO — anta destra: COPERTINA ###########################################################################
cover:
  # Stili: `photo` oppure `mosaic` (foto di studio dei modelli su carta: vedi images/mosaic/).
  # Con `photo`, `photo_layout` sceglie: `band` (foto in alto intera, testi sotto su fascia
  # carta) o `full` (foto a tutta pagina scurita in basso, testi chiari sopra).
  # giardino.jpg = giardino-originale.jpg ritoccata da scripts/ritocca_giardino.py
  # (senza il gambo davanti alla scarpa, colori del post Instagram).
  photo: {path: images/giardino.jpg, focus_x: 0.5, focus_y: 0.5, zoom: 1.08}  # zoom: taglia la staccionata a destra
  photo_layout: band
  title: Pedule urban fashion
  claim: Una storia italiana. Qualità ed eccellenza che si guardano, si toccano e si indossano.
  label: Made in Montebelluna · Italia

# ESTERNO — anta sinistra: RETRO ##############################################################################
back:
  eyebrow: Contatti
  title: Inizia il tuo viaggio
  title_italic: con MonPiz.
  text: Scopri la collezione completa nel lookbook digitale, o scrivici per diventare rivenditore MonPiz.
  contacts:
    - monpiz@monpiz.it
    - +39 376 066 9500
    - monpiz.it
    - instagram.com/monpiz_official
  qr:
    url: https://lookbook.monpiz.it
    label: Sfoglia il lookbook
  footer: MonPiz — Montebelluna, Italia

# INTERNO — anta sinistra: I MATERIALI (campioni veri) E I DETTAGLI ##########################################
materials:
  eyebrow: Tocca con mano
  title: I nostri materiali
  # Misura di ogni campione da incollare: il riquadro stampato è 2 mm più largo per lato.
  swatch_width_mm: 26
  swatch_height_mm: 34
  items:   # `preview` serve solo per l'anteprima a schermo (--swatch-preview)
    - name: Pelle Dakar
      text: Cuoio bovino lavorato con oli, cere e grassi. Con l'uso sviluppa una patina unica.
      preview: images/dakar-testa-di-moro.webp
    - name: Pelle Martellata
      text: Grana pronunciata, morbida al tatto. Mantiene nel tempo forma e colore.
      preview: images/pelle-martellata-nera.webp
    - name: Suede
      text: Pelle scamosciata, vellutata e leggermente ruvida al tatto.
      preview: images/suede-tabacco.webp
    - name: Cavallino
      text: Texture ricercata e carattere deciso.
      preview: images/cavallino-moka.webp

details:
  eyebrow: Made in Italy
  title: Qualità nei dettagli
  items:
    - {name: Tomaia, description: in pelle di vitello, image: images/upper.png}
    - {name: Fodera, description: in pelle di vitello con lavorazione sottovuoto, image: images/lining.png}
    - {name: Suola, description: in gomma Vibram, image: images/sole.png}
    - {name: Ganci e anelli, description: in ferro con trattamento antiruggine, image: images/hardware.png}

# INTERNO — anta destra: LA STORIA E LA RETE DI NEGOZI ######################################################
story:
  eyebrow: Come nasce MonPiz
  title: Tra tradizione ed innovazione.
  paragraphs:
    - >-
      Negli anni ’50 Montebelluna, in provincia di Treviso, è diventata un centro
      di eccellenza per la produzione di calzature tecniche. Le pedule, scarpe
      progettate per il trekking e l’escursionismo, sono nate qui grazie
      all’abilità e alla tradizione dei calzolai locali.
    - >-
      MonPiz coniuga tradizione artigianale e innovazione, introducendo materiali
      dell’eccellenza italiana e migliorando comfort e prestazioni delle pedule
      senza compromettere la qualità. Un twist urbano, a proprio agio su
      qualsiasi terreno.
  photo: {path: images/heritage.jpg}   # mostrata intera, accanto all'ultimo paragrafo

retailers:
  eyebrow: Dove trovarci
  title: Una rete di {count} negozi.    # {count} = numero di negozi in retailers.yaml
  text: Trova il rivenditore più vicino su monpiz.it
  source: retailers.yaml                # stesso file del lookbook
  map:            # area disegnata: più stretta che nel lookbook, per ingrandire i punti
    north: 46.95
    south: 44.95
    west: 9.45
    east: 13.95
    labels:
      - {name: Bolzano, at: [46.50, 11.35]}
      - {name: Cortina, at: [46.54, 12.14]}
      - {name: Trento, at: [46.07, 11.12]}
      - {name: Belluno, at: [46.14, 12.22]}
      - {name: Udine, at: [46.06, 13.23]}
